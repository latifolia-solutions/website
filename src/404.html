  <body class="min-h-screen antialiased">
    <script type="application/ld+json">
      {

    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Latifolia Solutions",
        "url": "https://latifolia.solutions/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://latifolia.solutions/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <div
      style="
        font-family:
          system-ui, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif,
          &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;;
        height: 100vh;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      "
    >
      <div>
        <style>
          body {
            color: #000;
            background: #fff;
            margin: 0;
          }
          .next-error-h1 {
            border-right: 1px solid rgba(0, 0, 0, 0.3);
          }
          @media (prefers-color-scheme: dark) {
            body {
              color: #fff;
              background: #000;
            }
            .next-error-h1 {
              border-right: 1px solid rgba(255, 255, 255, 0.3);
            }
          }
        </style>
        <h1
          class="next-error-h1"
          style="
            display: inline-block;
            margin: 0 20px 0 0;
            padding: 0 23px 0 0;
            font-size: 24px;
            font-weight: 500;
            vertical-align: top;
            line-height: 49px;
          "
        >
          404
        </h1>
        <div style="display: inline-block">
          <h2
            style="
              font-size: 14px;
              font-weight: 400;
              line-height: 49px;
              margin: 0;
            "
          >
            This page could not be found.
          </h2>
        </div>
      </div>
    </div>
    <script>
      // Fade-in for [data-animate] elements as they scroll into view
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("is-visible");
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.1 },
      );
      document
        .querySelectorAll("[data-animate]")
        .forEach((el) => io.observe(el));

      // Solid nav background once the page is scrolled
      const nav = document.querySelector("nav");
      if (nav) {
        addEventListener(
          "scroll",
          () => {
            const scrolled = scrollY > 40;
            nav.classList.toggle("backdrop-blur-md", scrolled);
            nav.classList.toggle("shadow-sm", scrolled);
            nav.style.backgroundColor = scrolled
              ? "rgba(30, 58, 43, 0.95)"
              : "transparent";
          },
          { passive: true },
        );
      }

      const year = document.getElementById("year");
      if (year) year.textContent = new Date().getFullYear();
    </script>
  </body>
